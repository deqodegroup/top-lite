name: TOP Lite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check STORM runtime syntax
        run: |
          node --check api/storm.js
          node --check api/tts.js
          node --check lib/opendex-runtime.js
          node --check lib/storm-knowledge.js
      - name: Build TOP Lite
        run: npm run build
